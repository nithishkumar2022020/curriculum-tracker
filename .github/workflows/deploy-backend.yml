name: Deploy Backend to Render

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test backend
      run: |
        cd backend
        python -c "import main; print('Backend imports successfully')"

    - name: Deploy to Render
      run: |
        echo "Backend deployment triggered by push to main branch"
        echo "Render will automatically deploy from GitHub repository"
        echo "Backend URL: https://curriculum-tracker-new-backend.onrender.com"